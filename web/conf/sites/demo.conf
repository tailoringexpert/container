<VirtualHost *:8080>
    Alias /static/i18n/demo "/custom/demo/static/i18n"
    <Directory "/custom/demo/static/i18n">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All 
        Require all granted
    </Directory>
  
    Alias /static/demo "/custom/demo/static"
    <Directory "/custom/demo/static">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    Alias /assets/arsu "/custom/demo/assets"
    <Directory "/custom/demo/assets">
        Options Indexes FollowSymLinks Includes ExecCGI
        AllowOverride All 
        Require all granted
    </Directory>
 </VirtualHost>  
 
